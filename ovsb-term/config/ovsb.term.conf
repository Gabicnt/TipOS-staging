[main]
term = ovsb.term
shell = /bin/sh
login_shell = false

[font]
family = monospace
size = 12
dpi = 96
bold_family = monospace:style=Bold
italic_family = monospace:style=Italic
bold_italic_family = monospace:style=Bold:style=Italic
antialias = true
hinting = true

[colors]
background = #1e1e1e
foreground = #d4d4d4
cursor = #ffffff
selection_bg = #264f78
selection_fg = #ffffff
palette_0 = #000000
palette_1 = #cd3131
palette_2 = #0dbc79
palette_3 = #e5e510
palette_4 = #2472c8
palette_5 = #bc3fbc
palette_6 = #11a8cd
palette_7 = #e5e5e5
palette_8 = #666666
palette_9 = #f14c4c
palette_10 = #23d18b
palette_11 = #f5f543
palette_12 = #3b8eea
palette_13 = #d670d6
palette_14 = #29b8db
palette_15 = #e5e5e5

[cursor]
style = block
blink = true
blink_interval = 500
color = #ffffff

[scrollback]
lines = 10000

[input]
alt_sends_escape = true
shift_pgup_scroll = true
mouse_tracking = true

[keybindings]
copy = Ctrl+Shift+C
paste = Ctrl+Shift+V
select_all = Ctrl+Shift+A
new_tab = Ctrl+Shift+T
close_tab = Ctrl+Shift+W
next_tab = Ctrl+Page_Down
prev_tab = Ctrl+Page_Up
scroll_up = Shift+Page_Up
scroll_down = Shift+Page_Down
scroll_top = Shift+Home
scroll_bottom = Shift+End
font_increase = Ctrl+plus
font_decrease = Ctrl+minus
font_reset = Ctrl+0
fullscreen = F11
